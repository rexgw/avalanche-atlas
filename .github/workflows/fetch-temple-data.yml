name: Fetch Mount Temple data
# Run by hand from the Actions tab to refresh the elevation, trail and weather snapshot data.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install rasterio numpy
      - run: SITE=temple python build/fetch_site.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add build/data/temple
          git diff --cached --quiet || git commit -m "Fetch Mount Temple source data"
          git push
