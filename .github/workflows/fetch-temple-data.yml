name: Fetch Mount Temple data
on:
  workflow_dispatch:
  push:
    paths: [build/fetch_temple.py, .github/workflows/fetch-temple-data.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install rasterio numpy
      - run: python build/fetch_temple.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add build/data/temple
          git diff --cached --quiet || git commit -m "Fetch Mount Temple source data"
          git push
